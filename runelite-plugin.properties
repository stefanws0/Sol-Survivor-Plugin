description=Plan your Fortis Colosseum waves tick by tick: one click opens the wave you're in on Sol Survivor, a free planner and solver in your browser. The panel lists each wave's NPCs, reports your mistakes when a wave ends and shows what hit you after a death. In the arena it can draw a wave box, NPC hitpoints, a tick counter and more, each one yours to switch off. Off by default: Upload past runs sends a run to the site when you press Watch, and Share wave logs sends each wave's log, which with Leaderboard on puts your times on the site's leaderboard.
